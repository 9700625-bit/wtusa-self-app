<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- Волна 5 (аудит 14.10.2026, B-72, SEC-9): политика безопасности (CSP). GitHub Pages заголовков не ставит —
       поэтому meta, и она стоит до любого скрипта и стиля. Скрипты — только свои и SDK telegram.org; запросы — только
       к своему сайту и бэкенду Apps Script (script.google.com и его ответы-редиректы на script.googleusercontent.com):
       внедрённый скрипт не сможет отправить данные студента на чужой сервер ни fetch-ем, ни картинкой.
       'unsafe-inline' для скриптов и стилей — осознанно: на странице есть обработчики в разметке (onload/onerror у SDK,
       onclick «Обновить»), а хеши для них требуют 'unsafe-hashes', которого нет в старых webview Telegram (iOS < 15.4) —
       там приложение перестало бы запускаться. frame-ancestors в meta не работает (защита от встраивания — скрипт ниже). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Work & Travel USA — SELF</title>
  <!-- ОДИН ШРИФТ ВЕЗДЕ (22.09.2026). В css/styles.css первым стоял Inter, но
       сам шрифт никогда не подключался — на телефоне всё падало на системный,
       а кнопки/поля местами брали ещё и «свой» системный шрифт формы. Теперь
       Inter подключён явно (кириллица, 4 начертания, display=swap — текст
       виден сразу системным и через долю секунды переключается), а все
       элементы форм наследуют шрифт страницы (см. reset в styles.css).
       preconnect экономит рукопожатие: ~100 мс на первом открытии. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Иконка вкладки. Инлайном, чтобы не тратить отдельный запрос и не
       ловить 404 на /favicon.ico, который браузер просит сам. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1b3a'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <!-- Official Telegram Mini Apps SDK. Safe to load outside Telegram too —
       window.Telegram simply stays undefined and js/services/telegram.js
       no-ops in that case (useful for browser-based development/QA). -->
  <!-- P12-аудит (12.10.2026): defer. Что ломалось: обычный скрипт в <head> останавливал разбор
       страницы до ответа telegram.org — шапка и всё остальное ждали чужой сервер. С defer
       скрипт качается параллельно и выполняется после разбора, но ДО модулей приложения
       (отложенные скрипты и модули идут по порядку в документе), так что window.Telegram к
       запуску app.js уже есть. Встроенные скрипты ниже window.Telegram не используют. -->
  <!-- Волна 5 (аудит 14.10.2026, B-10): async вместо defer. Что ломалось: defer-скрипт и модули
       выполняются строго по порядку, поэтому при медленном telegram.org (2 с) даже экран из памяти
       телефона ждал 2 с, а при зависшем SDK страница оставалась пустой (DOMContentLoaded не наступал,
       страховка ниже не срабатывала). Теперь SDK качается и выполняется сам по себе, приложение
       стартует сразу и ждёт SDK только перед запросами к серверу (js/services/telegram.js,
       telegramReady). Метки onload/onerror нужны, чтобы приложение знало, чем кончилась загрузка,
       даже если это случилось раньше, чем оно запустилось.
       Ревью В-3: заставку Telegram на телефоне снимает WebApp.ready() (без него — только событие load,
       которое ждёт и этот async-скрипт). Поэтому ready() вызывается прямо здесь, как только SDK
       выполнился, — не дожидаясь файлов приложения и ответа сервера (раньше его звал app.js при старте). -->
  <script src="https://telegram.org/js/telegram-web-app.js" async onload="window.__sdkState='load';try{if(!window.__tgReadyCalled&&window.Telegram&&window.Telegram.WebApp){window.__tgReadyCalled=true;window.Telegram.WebApp.ready();}}catch(e){}" onerror="window.__sdkState='error'"></script>

  <!--
    ПРЕДЗАГРУЗКА МОДУЛЕЙ (14.09.2026).

    Приложение собрано из 26 ES-модулей без шага сборки — это осознанно, но
    у браузера из-за этого нет способа узнать о файле, пока он не скачал и
    не разобрал того, кто его импортирует. Получалась лестница: первый файл
    стартовал на 749-й миллисекунде, последний догружался на 3896-й. Три
    секунды на 68 килобайт — это не вес, это 26 последовательных запросов.

    modulepreload снимает именно это: браузер узнаёт обо всех модулях из
    разметки и запрашивает их сразу, одной волной, параллельно. Код при
    этом не меняется ни на строку — порядок выполнения по-прежнему задают
    сами import'ы.

    ВАЖНО: путь здесь должен совпадать с тем, что стоит в import,
    СИМВОЛ В СИМВОЛ, включая "?v=3" у format.js. Иначе браузер посчитает
    это разными адресами и скачает файл дважды.

    Демо-режим (mockApi.js, mockData.js, demoPanel.js) здесь намеренно
    отсутствует — он грузится динамически и только при пустом BACKEND_URL,
    см. js/services/api.js и конец js/app.js.
  -->
  <link rel="modulepreload" href="js/router.js" />
  <link rel="modulepreload" href="js/components/nav.js" />
  <link rel="modulepreload" href="js/components/statusBadge.js" />
  <link rel="modulepreload" href="js/config/roadmap.config.js" />
  <link rel="modulepreload" href="js/config/briefingRoster.config.js" />
  <link rel="modulepreload" href="js/services/api.js" />
  <link rel="modulepreload" href="js/services/liveApi.js" />
  <link rel="modulepreload" href="js/services/config.js" />
  <link rel="modulepreload" href="js/services/telegram.js" />
  <link rel="modulepreload" href="js/services/actions.js" />
  <link rel="modulepreload" href="js/services/deriveViews.js" />
  <link rel="modulepreload" href="js/screens/home.js" />
  <link rel="modulepreload" href="js/screens/roadmap.js" />
  <link rel="modulepreload" href="js/screens/documents.js" />
  <link rel="modulepreload" href="js/utils/docsView.js" />
  <link rel="modulepreload" href="js/screens/payments.js" />
  <link rel="modulepreload" href="js/screens/profile.js" />
  <link rel="modulepreload" href="js/screens/statusDetail.js" />
  <link rel="modulepreload" href="js/screens/celebration.js" />
  <link rel="modulepreload" href="js/screens/events.js" />
  <link rel="modulepreload" href="js/utils/format.js?v=3" />
  <link rel="modulepreload" href="js/utils/navigation.js" />
</head>
<body>
<div class="app">
  <header class="top">
    <!-- Текст плашки подставляется из данных участника в app.js; здесь он
         остаётся как запасной вариант на случай, если сезон не пришёл. -->
    <div class="brand"><b>ABC Universe · Work &amp; Travel USA</b><!-- Год сюда не пишем (14.09.2026): плашку заполняет подставитьСезонВШапку()
         из данных участника. Пока состояния нет — на экране ошибки, до ответа
         сервера — видно только программу, и это честно. Раньше здесь стояло
         «SELF 2027», и этот год показывался всем, у кого сезон не пришёл из
         сделки, то есть всем. --><span class="pill" id="brand-season">SELF</span></div>
  </header>
  <main class="content" id="screen-root" aria-live="polite"></main>
  <nav class="bottom" id="bottom-nav"></nav>
</div>
<!--
  ПУСТАЯ СТРАНИЦА БЕЗ ЕДИНОГО СЛОВА (05.10.2026). Приложение — это два десятка
  файлов; если хотя бы один не скачался (обрыв связи при открытии), не запускается
  ничего: ни экран, ни меню, ни сообщение об ошибке — их все рисует app.js.
  Студент видел пустую страницу и не знал, что делать. Этот маленький блок от
  остальных файлов не зависит: при ошибке загрузки показывает объяснение и кнопку.
-->
<script>
  /* «ОБНОВИТЬ» СКАЧИВАЕТ ФАЙЛЫ ЗАНОВО (07.10.2026). Простая перезагрузка страницы берёт файлы приложения
     из памяти телефона, пока им меньше 10 минут: кнопка «Обновить» в это время ничего не меняла, и та же
     карточка появлялась снова. Теперь сначала скачиваем файлы мимо памяти телефона (это обновляет и её),
     потом перезагружаем страницу. Нет связи или прошло 8 секунд — перезагружаем как раньше. */
  function __appRefresh(btn) {
    if (btn) btn.disabled = true;
    var done = false;
    var reload = function () { if (done) return; done = true; location.reload(); };
    try {
      var urls = ["js/app.js"].concat([].map.call(document.querySelectorAll('link[rel="modulepreload"]'), function (l) { return l.getAttribute("href"); }));
      Promise.all(urls.map(function (u) { return fetch(u, { cache: "reload" }).then(function (r) { return r.text(); }).catch(function () {}); })).then(reload, reload);
      setTimeout(reload, 8000);
    } catch (e) { reload(); }
  }
  /* Волна 5 (ревью, М-1): «пусто» — ничего нет или только наш индикатор «Загружаем…» (см. ниже). */
  function __appRootBlank() {
    var root = document.getElementById("screen-root");
    if (!root) return false;
    var h = root.innerHTML.trim();
    return h === "" || (h.indexOf('id="app-boot-wait"') !== -1 && root.children.length === 1);
  }
  function __appLoadFailed() {
    var root = document.getElementById("screen-root");
    if (!__appRootBlank()) return;
    root.innerHTML =
      '<div class="card"><h2>Не удалось загрузить приложение</h2>' +
      '<div class="sub">Похоже, интернет пропал. Проверьте соединение и нажмите «Обновить».</div>' +
      '<button class="btn btn-primary" style="margin-top:14px" onclick="__appRefresh(this)">Обновить</button></div>';
  }
</script>
<script type="module" src="js/app.js" onerror="__appLoadFailed()"></script>
<script>
  /* СТРАХОВКА ОТ ПУСТОГО ЭКРАНА ПОСЛЕ ПУБЛИКАЦИИ (06.10.2026). Если на телефоне оказались файлы
     приложения разных версий (часть из кеша, часть новые) или в файле ошибка, браузер не
     запускает НИ ОДНОГО модуля и onerror у тега выше не вызывает: студент видел пустую страницу
     без слов и кнопок. Событие load наступает после попытки запуска: при обычном старте на
     экране к этому моменту уже есть «Подключаем ваш профиль» или индикатор загрузки. Пусто —
     значит, приложение не стартовало.
     07.10.2026: отсчёт идёт от DOMContentLoaded, а не от load. Модули приложения к этому событию уже
     выполнены (или не смогли), а load ждёт ещё и шрифт с чужого сервера: если тот зависал, пустой
     экран держался не 1,5 секунды, а пока не кончится запрос шрифта. */
  function __appBlankCheck() {
    var root = document.getElementById("screen-root");
    if (window.__appStarted || !__appRootBlank()) return;
    root.innerHTML =
      '<div class="card"><h2>Приложение обновляется</h2>' +
      '<div class="sub">Мы только что выпустили новую версию, и телефон ещё не скачал её целиком. Нажмите «Обновить». Если не помогло — закройте приложение и откройте его снова через несколько минут.</div>' +
      '<button class="btn btn-primary" style="margin-top:14px" onclick="__appRefresh(this)">Обновить</button></div>';
  }
  /* Волна 5 (аудит 14.10.2026, B-10; ревью М-1): карточка «Приложение обновляется» — только когда
     приложение действительно не запустилось: DOMContentLoaded наступил (все модули выполнены или не
     смогли), а js/app.js так и не поставил отметку window.__appStarted. Медленный интернет — не повод:
     раньше таймер 4 с от разбора страницы показывал «выпустили новую версию», пока файлы ещё качались.
     Теперь в этом случае через 4 с — обычный индикатор «Загружаем…»; а если файлы не пришли и за 15 с
     (DOMContentLoaded не наступил вовсе) — «Не удалось загрузить приложение» с «Обновить». */
  setTimeout(function () {
    var root = document.getElementById("screen-root");
    if (window.__appStarted || !root || root.innerHTML.trim() !== "") return;
    root.innerHTML = '<div id="app-boot-wait" class="loading-spinner" style="flex-direction:column" role="status" aria-label="Загрузка"><span class="spinner-dot"></span>' +
      '<div class="sub" style="margin-top:12px;text-align:center">Загружаем приложение — медленный интернет, подождите немного.</div></div>';
  }, 4000);
  setTimeout(function () { if (!window.__appStarted) __appLoadFailed(); }, 15000);
  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(__appBlankCheck, 1500);
  });
</script>
</body>
</html>
