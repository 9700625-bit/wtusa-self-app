<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<script>
/* ЗАЩИТА ОТ ВСТРАИВАНИЯ В ЧУЖОЙ САЙТ (06.10.2026). GitHub Pages не умеет
   отдавать заголовок X-Frame-Options, поэтому любую страницу координатора мог
   показать у себя в рамке посторонний сайт и подставлять под курсор её кнопки.
   Страница работает только сама по себе либо в рамке нашего же кабинета
   (admin-panel.html — тот же сайт). В чужой рамке прячем всё и пробуем
   открыть страницу вместо чужого сайта. */
(function () {
  var свой = false;
  try { свой = window.top === window.self || window.top.location.origin === window.location.origin; } catch (e) { свой = false; }
  if (свой) return;
  document.documentElement.style.display = "none";
  try { window.top.location = window.self.location.href; } catch (e) { /* рамка с sandbox — остаёмся спрятанными */ }
})();
</script>
  <title>Кабинет координатора — ABC Universe</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ОДИН ВХОД — ТРИ ИНСТРУМЕНТА (22.09.2026). Раньше admin.html,
       admin-events.html и admin-users.html были тремя адресами с тремя
       экранами входа. Здесь — одна страница с вкладками; каждая вкладка
       показывает прежнюю страницу во фрейме. Пароль вводится один раз: он
       хранится в sessionStorage, а фреймы того же сайта читают его сами и
       входят автоматически. Сами страницы не менялись — их можно открывать
       и по старым адресам. */
    html,body{height:100%}
    body{display:flex;flex-direction:column}
    .app{max-width:none;width:100%;flex:1;display:flex;flex-direction:column;padding:0}
    .panel-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff}
    .panel-top b{font-size:15px}
    .panel-tabs{display:flex;gap:4px;margin-left:auto}
    .panel-tab{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;opacity:.8}
    .panel-tab.active{background:#fff;color:var(--navy);opacity:1}
    .panel-logout{margin-left:8px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;cursor:pointer}
    .frames{flex:1;position:relative;background:var(--bg)}
    .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
    .frames iframe.active{display:block}
    #gate{max-width:340px;margin:80px auto;padding:0 16px}
    @media (max-width:560px){
      .panel-top{flex-wrap:wrap}
      .panel-tabs{margin-left:0;width:100%;order:3}
      .panel-tab{flex:1;text-align:center;padding:8px 6px;font-size:12.5px}
    }
  /* СООБЩЕНИЯ НА СТРАНИЦЕ ВМЕСТО ОКОН alert (12.10.2026), см. сообщение(). */
#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 20px));z-index:50;display:grid;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(15,35,68,.16);font-size:14px;line-height:1.4;white-space:pre-line;overflow-wrap:anywhere}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast-x{margin-left:auto;flex:none;background:none;border:0;font-size:16px;line-height:1;padding:2px 4px;cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>

<div id="gate">
  <div class="card">
    <h2>Кабинет координатора</h2>
    <div class="field">
      <label for="secret-input" style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">Секретный код</label>
      <input id="secret-input" type="password" placeholder="ADMIN_SECRET" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px" />
    </div>
    <button class="btn" id="gate-submit">Войти</button>
    <div class="sub" style="margin-top:10px">Один вход — для привязки студентов, мероприятий и списка участников.</div>
    <div id="gate-err" role="alert" style="color:var(--danger);font-size:13px;margin-top:10px"></div>
  </div>
</div>

<div class="app" id="main" style="display:none">
  <div class="panel-top">
    <b>ABC Universe · координатор</b>
    <div class="panel-tabs">
      <button type="button" class="panel-tab active" data-tab="link">Привязка</button>
      <button type="button" class="panel-tab" data-tab="events">Мероприятия</button>
      <button type="button" class="panel-tab" data-tab="users">Студенты</button>
    </div>
    <button type="button" class="panel-logout" id="logout-btn">Выйти</button>
  </div>
  <div class="frames">
    <iframe data-tab="link" class="active" title="Привязка студентов"></iframe>
    <iframe data-tab="events" title="Мероприятия и посещаемость"></iframe>
    <iframe data-tab="users" title="Студенты"></iframe>
  </div>
</div>

<script>
/**
 * СООБЩЕНИЯ НА СТРАНИЦЕ ВМЕСТО alert (12.10.2026).
 *
 * Что ломалось. Итог фоновых действий (ответ сервера после отправки, сбой
 * отметки, сбой загрузки) показывался окном alert: оно останавливает страницу,
 * пока его не закроют, а в кабинете (страница во фрейме) всплывало поверх
 * соседней вкладки. Пока окно висело, остальные ответы ждали — по одной
 * неудачной отметке посещаемости приходилось закрывать по окну на строку.
 *
 * Теперь — плашка вверху страницы: не мешает работать, остаётся, пока её не
 * закроют (✕); успешные сообщения исчезают сами через 10 секунд. Окна
 * confirm остались только прямо перед отправкой сообщений студентам.
 */
function сообщение(текст, вид) {
  const box = document.getElementById("toasts");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "toast" + (вид ? " " + вид : "");
  el.setAttribute("role", вид === "err" ? "alert" : "status");
  const t = document.createElement("div");
  t.textContent = текст;
  const x = document.createElement("button");
  x.type = "button";
  x.className = "toast-x";
  x.title = "Закрыть";
  x.textContent = "✕";
  x.addEventListener("click", () => el.remove());
  el.append(t, x);
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  if (вид === "ok") setTimeout(() => el.remove(), 10000);
}

  // Тот же ключ, что и во всех трёх страницах — они войдут сами.
  const SECRET_KEY = "wtusa_admin_secret";
  const SRC = { link: "admin.html", events: "admin-events.html", users: "admin-users.html" };
  const gateEl = document.getElementById("gate");
  const mainEl = document.getElementById("main");

  function showMain() {
    gateEl.style.display = "none";
    mainEl.style.display = "flex";
    // Фреймы грузим лениво: активный — сразу, остальные — при первом открытии.
    activate(location.hash.replace("#", "") || "link");
  }

  function activate(tab) {
    // Только свои три вкладки: «#constructor» и подобные адреса раньше давали пустой кабинет.
    if (!Object.prototype.hasOwnProperty.call(SRC, tab)) tab = "link";
    document.querySelectorAll(".panel-tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
    document.querySelectorAll(".frames iframe").forEach((f) => {
      const on = f.dataset.tab === tab;
      f.classList.toggle("active", on);
      if (on && !f.src) f.src = SRC[tab];
    });
    history.replaceState(null, "", "#" + tab);
  }

  document.querySelectorAll(".panel-tab").forEach((b) => b.addEventListener("click", () => activate(b.dataset.tab)));
  document.getElementById("logout-btn").addEventListener("click", () => {
    try { sessionStorage.removeItem(SECRET_KEY); } catch (e) {}
    location.reload();
  });

  // ОДИН ВХОД — ОДНА ЗАГРУЗКА (12.10.2026). Двойное нажатие «Войти» (или Enter
  // плюс щелчок) запускало вход дважды. Теперь второй раз ничего не делает.
  // Если вкладка-фрейм отклонила код, она стирает его, оставляет причину в
  // sessionStorage и перезагружает кабинет — причину показываем под формой входа
  // (раньше форма просто появлялась снова, без объяснения).
  let входВыполнен = false;
  try {
    const причина = sessionStorage.getItem("wtusa_admin_gate_msg");
    if (причина) {
      document.getElementById("gate-err").textContent = причина;
      sessionStorage.removeItem("wtusa_admin_gate_msg");
    }
  } catch (e) {}

  const input = document.getElementById("secret-input");
  function tryEnter() {
    if (входВыполнен) return;
    const value = input.value.trim();
    if (!value) return;
    // 05.10.2026: при запрещённых в Chrome cookie/данных сайта обращение к
    // sessionStorage бросает исключение — «Войти» молча не делала ничего.
    try {
      sessionStorage.setItem(SECRET_KEY, value);
    } catch (e) {
      // 12.10.2026: плашка вместо окна alert. Вкладкам кабинета код передаётся только через
      // хранилище, поэтому без него кабинет не откроется — подсказываем, что делать.
      сообщение("Браузер не даёт сохранить код входа: в настройках Chrome для этого сайта запрещены cookie и данные сайтов. Разрешите их и обновите страницу — или откройте нужную страницу отдельно (admin.html, admin-events.html, admin-users.html): там можно работать и без сохранения кода.", "err");
      return;
    }
    входВыполнен = true;
    showMain(); // проверка кода — на первой же загрузке вкладки: при ошибке она сама покажет «Не удалось войти»
  }
  document.getElementById("gate-submit").addEventListener("click", tryEnter);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryEnter(); });

  let естьКод = false;
  try { естьКод = !!sessionStorage.getItem(SECRET_KEY); } catch (e) {}
  if (естьКод) { входВыполнен = true; showMain(); }
</script>
</body>
</html>
